<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Studio — Release overview</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #15232b; background: #e9ece8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { height: 74px; background: #14252d; color: #f2f2ec; display: flex; align-items: center; justify-content: space-between; padding: 0 52px; }
    .wordmark { font-size: 20px; font-weight: 800; letter-spacing: -.04em; }
    .wordmark span { color: #e4ad6f; }
    nav { display: flex; gap: 38px; color: #aebfc5; font-size: 13px; }
    nav strong { color: #fff; border-bottom: 2px solid #e4ad6f; padding-bottom: 27px; }
    main { max-width: 1200px; margin: 0 auto; padding: 48px 0 40px; }
    .eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .18em; color: #9c6040; }
    .heading { display: flex; align-items: end; justify-content: space-between; margin: 9px 0 30px; }
    h1 { font-size: 48px; letter-spacing: -.06em; line-height: 1; margin: 0; }
    p { color: #61717a; font-size: 16px; margin: 12px 0 0; }
    button { border: 0; border-radius: 4px; background: #c65e3d; color: #fff; font: 700 14px inherit; padding: 17px 25px; min-width: 170px; cursor: pointer; }
    button:hover, button:focus-visible { background: #a9482d; outline: 3px solid #e4ad6f; outline-offset: 3px; }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 22px; }
    .panel { background: #fff; border: 1px solid #d9deda; border-radius: 8px; padding: 27px 30px; }
    .panel h2 { font-size: 15px; margin: 0 0 24px; }
    .chart { height: 250px; display: flex; align-items: end; gap: 13px; border-bottom: 1px solid #cfd7d3; padding: 14px 0 0; }
    .bar { flex: 1; background: #284d59; min-height: 14px; }
    .bar:nth-child(3n) { background: #c65e3d; }
    .labels { display: flex; justify-content: space-between; font: 11px ui-monospace, monospace; color: #718087; margin-top: 12px; }
    .metric { font-size: 68px; line-height: 1; letter-spacing: -.07em; font-weight: 800; }
    .metric-note { color: #257b65; font-weight: 700; margin-top: 12px; }
    .row { display: flex; justify-content: space-between; border-top: 1px solid #e6ebe8; padding: 17px 0; font-size: 13px; }
    .row span:last-child { color: #718087; }
    #status { color: #805544; }
    .published #status { color: #257b65; }
    .published #publish { background: #257b65; }
  </style>
</head>
<body>
  <header><div class="wordmark">ATLAS <span>STUDIO</span></div><nav><strong>Overview</strong><span>Stories</span><span>Audience</span><span>Settings</span></nav></header>
  <main>
    <div class="eyebrow">SPRING RELEASE / OVERVIEW</div>
    <div class="heading"><div><h1>Make the moment count.</h1><p>One place to shape and publish what comes next.</p></div><button id="publish" type="button">Publish update</button></div>
    <div class="grid">
      <section class="panel"><h2>Audience momentum</h2><div class="chart" aria-label="Audience activity over twelve weeks">
        <div class="bar" style="height:38%"></div><div class="bar" style="height:52%"></div><div class="bar" style="height:45%"></div><div class="bar" style="height:61%"></div><div class="bar" style="height:57%"></div><div class="bar" style="height:68%"></div><div class="bar" style="height:71%"></div><div class="bar" style="height:66%"></div><div class="bar" style="height:78%"></div><div class="bar" style="height:76%"></div><div class="bar" style="height:89%"></div><div class="bar" style="height:96%"></div>
      </div><div class="labels"><span>W01</span><span>W04</span><span>W08</span><span>W12</span></div></section>
      <section class="panel"><h2>Release health</h2><div class="metric">94.8<span style="font-size:30px">%</span></div><div class="metric-note">↑ 8.2% this month</div><div style="height:48px"></div><div class="row"><span>Reach</span><span>28.4k</span></div><div class="row"><span>Engagement</span><span>11.6k</span></div><div class="row"><span id="status">Ready to publish</span><span>Today</span></div></section>
    </div>
  </main>
  <script>
    document.querySelector('#publish').addEventListener('click', () => {
      document.body.classList.add('published');
      document.querySelector('#status').textContent = 'Update published';
      document.querySelector('#publish').textContent = 'Published';
    });
  </script>
</body>
</html>
