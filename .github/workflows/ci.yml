name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run schema:json
      - run: git diff --exit-code -- schema
      - run: node --test scripts/privacy-scan.test.mjs
      - run: npm run privacy:scan

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: runner.os == 'macOS'
        run: brew install ffmpeg
      - if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - run: npm test
        env:
          VID2_REQUIRE_FFMPEG: '1'
          # Homebrew ffmpeg ships without libass; macOS exercises the raster text backend.
          VID2_REQUIRE_LIBASS: ${{ runner.os != 'macOS' && '1' || '' }}

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node --test tests/e2e/pack.test.ts
        env:
          VID2_PACK_TEST: '1'

  ci:
    if: always()
    needs: [checks, test, pack]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs
        env:
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
          PACK: ${{ needs.pack.result }}
        run: test "$CHECKS" = success && test "$TEST" = success && test "$PACK" = success
