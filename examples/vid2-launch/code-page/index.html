<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>vid2 — timeline to video</title>
<style>
  :root { --bg: #0b0d12; --panel: #11151d; --line: #1d2330; --text: #d7dce5; --dim: #6b7486; --key: #8fb3ff; --str: #b7e38c; --num: #f0b86e; --accent: #3355ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 22px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .wrap { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 28px; padding: 56px 64px; height: calc(100% - 112px); box-sizing: border-box; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 16px 22px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 18px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #2a3140; }
  .file { margin-left: 10px; color: var(--text); }
  pre { margin: 0; padding: 26px 30px; white-space: pre; overflow: hidden; flex: 1; font-size: 20px; line-height: 1.55; }
  .k { color: var(--key); } .s { color: var(--str); } .n { color: var(--num); } .p { color: var(--dim); }
  .caret { display: inline-block; width: 11px; height: 24px; background: var(--accent); vertical-align: -4px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #term { font-size: 21px; white-space: pre-wrap; word-break: break-word; }
  .cmd { color: var(--text); } .ok { color: #7ee2a8; } .muted { color: var(--dim); }
  button#run { margin-left: auto; background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 10px 22px; font: inherit; font-size: 18px; cursor: pointer; }
  button#run.done { background: #1f7a4d; }
</style>
<div class="wrap">
  <section class="panel">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="file">demo/timeline.json</span></div>
    <pre id="code"></pre>
  </section>
  <section class="panel">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="file">terminal</span><button id="run">Run</button></div>
    <pre id="term"><span class="muted">$ </span><span class="caret"></span></pre>
  </section>
</div>
<script>
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
function highlight(src) {
  return esc(src).replace(/("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?)|([{}\[\],])/g, (m, str, colon, num, punct) =>
    str ? (colon ? '<span class="k">' + str + '</span>' + colon : '<span class="s">' + str + '</span>')
      : num ? '<span class="n">' + num + '</span>' : '<span class="p">' + punct + '</span>');
}
async function typeCode() {
  const t = await (await fetch("demo-timeline.json")).json();
  // Show the head of the real timeline: output, beat and the first scene.
  const shown = { version: t.version, output: t.output, beat: t.beat, scenes: [t.scenes[0]] };
  const text = JSON.stringify(shown, null, 2);
  const el = document.getElementById("code");
  const start = performance.now();
  const total = 3200;
  (function step(now) {
    const n = Math.min(text.length, Math.floor(((now - start) / total) * text.length));
    el.innerHTML = highlight(text.slice(0, n)) + '<span class="caret"></span>';
    if (n < text.length) requestAnimationFrame(step);
  })(start);
}
async function run() {
  const btn = document.getElementById("run");
  if (btn.classList.contains("done")) return;
  btn.classList.add("done"); btn.textContent = "Running";
  const log = await (await fetch("render-log.json")).json();
  const d = log.data;
  const lines = [
    '<span class="muted">$ </span><span class="cmd">vid2 init launch-teaser demo &amp;&amp; vid2 render demo/timeline.json --profile proxy --placeholders --json</span>',
    ...log.warnings.map((w) => '<span class="muted">warn  ' + esc(w) + '</span>'),
    ...d.segments.map((s) => 'segment  ' + esc(s.id) + '  <span class="muted">' + (s.cached ? "cached" : "rendered") + '</span>'),
    'audio    <span class="n">' + d.audio.integrated + '</span> LUFS  <span class="muted">true peak</span> <span class="n">' + d.audio.truePeak + '</span> dBTP',
    '<span class="ok">✓</span> ' + d.frames + ' frames  ' + d.width + 'x' + d.height + '  <span class="muted">' + d.profile + '</span>  <span class="n">' + d.seconds.toFixed(1) + ' s</span>',
  ];
  const el = document.getElementById("term");
  for (let i = 1; i <= lines.length; i++) {
    el.innerHTML = lines.slice(0, i).join("\n") + (i < lines.length ? '\n<span class="caret"></span>' : "");
    await new Promise((r) => setTimeout(r, i === 1 ? 700 : 420));
  }
  btn.textContent = "Done";
}
document.getElementById("run").addEventListener("click", run);
typeCode();
</script>
</html>
